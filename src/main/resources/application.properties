spring.application.name=bloodbank

# ===============================
# DATABASE (Railway compatible)
# ===============================

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# SQL initialization
# ===============================

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ===============================
# JWT
# ===============================

app.jwt.secret=${APP_JWT_SECRET:ChangeThisSuperSecretKeyForProduction123456789}
app.jwt.expiration-ms=86400000

# ===============================
# CORS
# ===============================

app.frontend.url=${APP_FRONTEND_URL:*}

# ===============================
# SERVER (IMPORTANT FOR RAILWAY)
# ===============================

server.port=${PORT:8080}

# ===============================
# DevTools
# ===============================

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true